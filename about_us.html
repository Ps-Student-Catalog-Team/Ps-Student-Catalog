    <style>
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        @keyframes slideDown {
            from { 
                opacity: 0;
                transform: translateY(-30px);
            }
            to { 
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        @keyframes cardAppear {
            from { 
                opacity: 0;
                transform: translateY(20px);
            }
            to { 
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        body {
            animation: fadeIn 0.6s ease-out forwards;
        }
        
        .team-section {
            padding: 40px 20px;
            max-width: 1200px;
            margin: 0 auto;
            position: relative;
            opacity: 0;
            animation: fadeIn 0.5s ease-out 0.3s forwards;
        }
        
        .back-btn {
            display: block;
            width: fit-content;
            margin: 0 auto 40px;
            background: #1a1a1a;
            border: 2px solid var(--accent-color);
            color: var(--accent-color);
            padding: 12px 24px;
            font-size: 1em;
            cursor: pointer;
            transition: all 0.3s ease;
            border-radius: 8px;
            text-decoration: none;
            margin-top: 25px;
        }
        
        .back-btn:hover {
            background: var(--accent-color);
            color: #1a1a1a;
        }
        
        .team-title {
            font-size: 2.5rem;
            margin-bottom: 40px;
            color: var(--accent-color);
            text-align: center;
            opacity: 0;
            animation: slideDown 0.6s ease-out 0.5s forwards;
        }
        
        .team-members {
            padding-top: 60px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 40px;
        }
        
        .member-card {
            opacity: 0;
            animation: cardAppear 0.6s ease-out forwards;
        }
        
        .member-card:nth-child(1) {
            animation-delay: 0.7s;
        }
        
        .member-card:nth-child(2) {
            animation-delay: 0.9s;
        }
        
        .member-card:nth-child(3) {
            animation-delay: 1.1s;
        }
        
        .member-card:nth-child(4) {
            animation-delay: 1.3s;
        }
        
        .member-card {
            background: rgba(26, 26, 26, 0.8);
            border: 2px solid var(--accent-color);
            border-radius: 12px;
            padding: 30px;
            width: 300px;
            text-align: center;
            transition: all 0.3s ease;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(5px);
        }
        
        .member-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 30px rgba(0, 255, 157, 0.2);
        }
        
        .member-avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--accent-color);
            margin: 0 auto 20px;
            transition: all 0.3s ease;
        }
        
        .member-card:hover .member-avatar {
            transform: scale(1.05);
        }
        
        .member-name {
            font-size: 1.5rem;
            margin-bottom: 10px;
            color: var(--accent-color);
            font-weight: bold;
        }
        
        .member-role {
            font-style: italic;
            margin-bottom: 15px;
            color: #aaa;
        }

        .contact-icons {
            margin-top: 20px;
            display: flex;
            justify-content: center;
            gap: 20px;
        }
        
        .contact-icons a {
            color: var(--accent-color);
            font-size: 1.5rem;
            transition: all 0.3s ease;
        
        /* 模态框样式 */
        .member-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100    </style>
</head>
