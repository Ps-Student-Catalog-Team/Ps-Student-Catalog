<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户中心</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            background-color: rgba(255, 255, 255, 0.95);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin-bottom: 30px;
            text-align: center;
        }

        h1 {
            color: #4a5568;
            margin-bottom: 10px;
        }

        .user-info {
            color: #718096;
            font-size: 18px;
        }

        .nav-buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 20px 0;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }

        .btn-primary {
            background-color: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background-color: #5a67d8;
        }

        .btn-danger {
            background-color: #f56565;
            color: white;
        }

        .btn-danger:hover {
            background-color: #e53e3e;
        }

        .content-section {
            background-color: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        h2 {
            color: #4a5568;
            margin-bottom: 20px;
            text-align: center;
        }

        .comments-container {
            margin-top: 20px;
        }

        .comment-item {
            background-color: #f7fafc;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 15px;
            border-left: 4px solid #667eea;
        }

        .comment-content {
            margin: 10px 0;
            line-height: 1.6;
        }

        .comment-meta {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            color: #718096;
            margin-top: 15px;
        }

        .no-comments {
            text-align: center;
            color: #718096;
            font-style: italic;
            padding: 40px 0;
        }

        .loading {
            text-align: center;
            color: #718096;
            font-style: italic;
            padding: 40px 0;
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            .nav-buttons {
                flex-direction: column;
                align-items: center;
            }

            .btn {
                width: 100%;
                max-width: 200px;
                text-align: center;
            }

            .comment-meta {
                flex-direction: column;
                gap: 5px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>用户中心</h1>
            <div class="user-info">
                <span id="username"></span>
            </div>
            <div class="nav-buttons">
                <a href="../index.html" class="btn btn-primary">返回首页</a>
                <a href="comment.html" class="btn btn-primary">留言簿</a>
                <button class="btn btn-danger" onclick="logout()">退出登录</button>
            </div>
        </header>

        <div class="content-section">
            <h2>AList 账户</h2>
            <div style="text-align: center; margin: 20px 0;">
                <p>是否需要在 AList 上创建账户？</p>
                <div style="margin-top: 20px;">
                    <button class="btn btn-primary" onclick="createAlistAccount()">是</button>
                    <button class="btn" onclick="cancelAlistCreation()" style="margin-left: 10px; background-color: #e2e8f0; color: #4a5568;">暂不</button>
                </div>
                <div id="alistResult" style="margin-top: 20px; font-weight: bold;"></div>
            </div>
        </div>

        <div class="content-section">
            <h2>我的留言</h2>
            <div class="comments-container" id="commentsContainer">
                <div class="loading">加载中...</div>
            </div>
        </div>
    </div>

    <script>
        // 检查登录状态
        function checkLogin() {
            const username = localStorage.getItem('username');
            if (!username) {
                // 未登录，跳转到登录页
                window.location.href = 'login.html';
            } else {
                // 已登录，显示用户名
                document.getElementById('username').textContent = `欢迎，${username}`;
                // 加载用户留言
                loadUserComments(username);
            }
        }

        // 加载用户留言
        async function loadUserComments(username) {
            try {
                const response = await fetch('../php/get-user-comments.php', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ username })
                });

                if (!response.ok) {
                    throw new Error('网络响应错误: ' + response.status);
                }

                const comments = await response.json();
                const container = document.getElementById('commentsContainer');

                // 检查是否有错误信息
                if (comments.error) {
                    console.error('加载留言失败:', comments.error);
                    container.innerHTML = `<div class="no-comments">加载留言失败：${comments.error}</div>`;
                    return;
                }

                if (comments.length === 0) {
                    container.innerHTML = '<div class="no-comments">您还没有发送过留言</div>';
                    return;
                }

                // 渲染留言
                container.innerHTML = comments.map(comment => `
                    <div class="comment-item">
                        <div class="comment-content">${comment.comment}</div>
                        <div class="comment-meta">
                            <span>发送时间：${new Date(comment.created_at).toLocaleString()}</span>
                        </div>
                    </div>
                `).join('');
            } catch (error) {
                console.error('加载留言失败:', error);
                document.getElementById('commentsContainer').innerHTML = `<div class="no-comments">加载留言失败，请稍后重试：${error.message}</div>`;
            }
        }

        // 退出登录
        function logout() {
            localStorage.removeItem('username');
            window.location.href = 'login.html';
        }

        // 创建AList账户
        async function createAlistAccount() {
            const username = localStorage.getItem('username');
            const resultDiv = document.getElementById('alistResult');
            
            try {
                resultDiv.textContent = '正在创建AList账户...';
                
                const response = await fetch('../php/create-alist-account.php', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ username })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    resultDiv.textContent = `AList账户创建成功！用户名：${username}，密码：${data.password}`;
                    resultDiv.style.color = '#48bb78';
                } else {
                    resultDiv.textContent = `创建失败：${data.error}`;
                    resultDiv.style.color = '#f56565';
                }
            } catch (error) {
                resultDiv.textContent = `创建失败：${error.message}`;
                resultDiv.style.color = '#f56565';
            }
        }

        // 取消创建AList账户
        function cancelAlistCreation() {
            const resultDiv = document.getElementById('alistResult');
            resultDiv.textContent = '已取消创建AList账户';
            resultDiv.style.color = '#718096';
        }

        // 页面加载时检查登录状态
        window.onload = checkLogin;
    </script>
</body>
</html>
