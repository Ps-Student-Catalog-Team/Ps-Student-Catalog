name: Run Server with ngrok

on:
  workflow_dispatch:   # 手动触发

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          cd server
          npm install

      - name: Start server (background)
        run: |
          cd server
          node server.js &
          sleep 5
        # 假设 server.js 监听 3132 端口

      - name: Install ngrok
        run: |
          curl -s https://ngrok-agent.s3.amazonaws.com/ngrok.asc | sudo tee /etc/apt/trusted.gpg.d/ngrok.asc >/dev/null
          echo "deb https://ngrok-agent.s3.amazonaws.com buster main" | sudo tee /etc/apt/sources.list.d/ngrok.list
          sudo apt update && sudo apt install ngrok

      - name: Expose port via ngrok
        run: |
          ngrok config add-authtoken ${{ secrets.NGROK_AUTH_TOKEN }}
          ngrok http 3132 --log=stdout > ngrok.log &
          sleep 3
          cat ngrok.log | grep -o 'https://[a-z0-9]*\.ngrok\.io' | head -1 > ngrok_url.txt
          echo "NGROK_URL=$(cat ngrok_url.txt)" >> $GITHUB_ENV

      - name: Show ngrok URL
        run: echo "Public URL -> ${{ env.NGROK_URL }}"

      # 保持工作流运行一段时间，以便手动测试
      - name: Keep runner alive
        run: sleep 3600   # 可调整时长，最长 6 小时
