name: Run Server with ngrok

on:
  workflow_dispatch:

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          cd server
          npm install

      - name: Start server
        run: |
          cd server
          node server.js &
          sleep 5

      - name: Install ngrok
        run: |
          curl -s https://ngrok-agent.s3.amazonaws.com/ngrok.asc | sudo tee /etc/apt/trusted.gpg.d/ngrok.asc >/dev/null
          echo "deb https://ngrok-agent.s3.amazonaws.com buster main" | sudo tee /etc/apt/sources.list.d/ngrok.list
          sudo apt update && sudo apt install ngrok

      - name: Configure ngrok
        run: ngrok config add-authtoken ${{ secrets.NGROK_AUTH_TOKEN }}

      - name: Start ngrok
        run: |
          ngrok http 3132 --log=stdout > ngrok.log 2>&1 &
          sleep 5

      - name: Get ngrok URL via API
        run: |
          # 等待 API 可用
          for i in {1..15}; do
            if curl -s http://127.0.0.1:4040/api/tunnels > /dev/null; then
              break
            fi
            sleep 2
          done
          URL=$(curl -s http://127.0.0.1:4040/api/tunnels | jq -r '.tunnels[0].public_url')
          echo "NGROK_URL=$URL" >> $GITHUB_ENV
          echo "Public URL: $URL"

      - name: Keep runner alive for manual testing
        run: |
          echo "✅ ngrok is ready at ${{ env.NGROK_URL }}"
          echo "Press Ctrl+C to stop this job in the Actions UI, or wait for timeout."
          sleep 1800   # 30 分钟，可调整
